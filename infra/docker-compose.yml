version: '3.8'

services:
  # 1. PostgreSQL Relational State
  postgres:
    image: postgres:16-alpine
    container_name: smartcare-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smartcare}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  # 2. Redis In-Memory Queue Cache & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: smartcare-redis
    restart: always
    ports:
      - "6379:6379"

  # 3. Core FastAPI & Realtime Backend
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: smartcare-backend
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-smartcare}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-sih2026secretkey}
    ports:
      - "8000:8000"

  # 4. Patient Web & PWA App
  patient-portal:
    build:
      context: ../patient-portal
      dockerfile: Dockerfile
    container_name: smartcare-patient-portal
    restart: always
    ports:
      - "3000:80"

  # 5. Hospital Admin & Doctor Console
  admin-portal:
    build:
      context: ../admin-portal
      dockerfile: Dockerfile
    container_name: smartcare-admin-portal
    restart: always
    ports:
      - "3001:80"

volumes:
  pgdata:
