version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ../backend
    ports: ["8000:8000"]
  patient-portal:
    build: ../patient-portal
    ports: ["3000:80"]
  admin-portal:
    build: ../admin-portal
    ports: ["3001:80"]
