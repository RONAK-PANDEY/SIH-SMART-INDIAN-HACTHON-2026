apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartcare-backend
  labels:
    app: smartcare-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smartcare-backend
  template:
    metadata:
      labels:
        app: smartcare-backend
    spec:
      containers:
        - name: backend
          image: smartcare/backend:latest
          ports:
            - containerPort: 8000
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
            requests:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: smartcare-backend-svc
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: smartcare-backend
